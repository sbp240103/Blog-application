spring.application.name=app
server.port=${SERVER_PORT:9090}

# local secrets are read from a .env file in the project root, which is never committed
spring.config.import=optional:file:.env[.properties]

# db configuration
spring.datasource.url=jdbc:mysql://${MYSQL_DB_HOST:localhost}:${MYSQL_DB_PORT:3306}/${MYSQL_DB_NAME:blog_app}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_DB_USER:root}
spring.datasource.password=${MYSQL_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#create, update, create-update, validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# jwt, set JWT_SECRET (at least 32 characters) for anything beyond local development
jwt.secret=${JWT_SECRET:a-very-long-default-development-secret-key-for-hs256-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:18000000}

# optional admin account created on startup, set ADMIN_EMAIL and ADMIN_PASSWORD to enable
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Administrator}

# frontends allowed to call the api, comma separated
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# health and info for monitoring, nothing else is exposed
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=Blog Application
info.app.description=REST api for a blogging platform
info.app.version=1.0

# file related configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
project.image=images/
