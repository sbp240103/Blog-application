# tests run against an in memory database so they need no mysql server
spring.application.name=app

spring.datasource.url=jdbc:h2:mem:blogtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-secret-key-that-is-long-enough-for-hs256-signing
jwt.expiration-ms=600000

project.image=target/test-images
app.admin.email=
app.admin.password=

management.endpoints.web.exposure.include=health,info
