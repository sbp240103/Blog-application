# docker compose up --build
# values come from the .env file next to this file, the same one the app reads locally
services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DB_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB_NAME:-blog_app}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_DB_HOST: mysql
      MYSQL_DB_PORT: 3306
      MYSQL_DB_NAME: ${MYSQL_DB_NAME:-blog_app}
      MYSQL_DB_USER: root
      MYSQL_DB_PASSWORD: ${MYSQL_DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-for-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${SERVER_PORT:-9090}:9090"
    volumes:
      - images:/app/images

volumes:
  mysql-data:
  images:
